<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NTR Police Helmet Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="header">
  <img src="logo1.png" class="logo left" />
  <div class="titles">
    <h1>NTR Police Commissionerate</h1>
  </div>
  <img src="logo2.png" class="logo right" />
</header>

<main class="dashboard">

  <!-- TOP ROW -->
  <div class="row">
    <div class="tile massive safe" id="benzTile">
      <div class="name">DCP BUNGALOW</div>
      <div class="value" id="benzValue">--%</div>
    </div>

    <div class="tile massive safe" id="rameshTile">
      <div class="name">RAMESH HOSPITAL JUNCTION</div>
      <div class="value" id="rameshValue">--%</div>
    </div>
  </div>

  <!-- CENTER -->
  <div class="helmet">
    <div class="helmet-title">HELMET OBEDIENCE PERCENTAGE</div>
    <img src="helmetlogo.png" />
  </div>

  <!-- BOTTOM ROW -->
  <div class="row">
    <div class="tile massive safe" id="machavaramTile">
      <div class="name">MACHAVARAM</div>
      <div class="value" id="machavaramValue">--%</div>
    </div>

    <div class="tile massive safe" id="eluruTile">
      <div class="name">ELURU ROAD</div>
      <div class="value" id="eluruValue">--%</div>
    </div>

    <div class="tile massive safe" id="suryaraopetaTile">
      <div class="name">SURYARAOPETA</div>
      <div class="value" id="suryaraopetaValue">--%</div>
    </div>
  </div>

</main>

<footer class="footer">
  Every 1% increase saves lives. Wear a helmet.
</footer>

<script src="app.js"></script>
</body>
</html>
